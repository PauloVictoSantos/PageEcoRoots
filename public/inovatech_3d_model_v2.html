<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>INOVATECH – Hidroponia Indoor 3D v2</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --g:#22c55e;--gl:#4ade80;--gd:#166534;
  --bg:rgba(10,14,25,.88);--bd:rgba(34,197,94,.2);--bda:rgba(34,197,94,.4);
  --txt:#94a3b8;--txtd:#475569;--txtl:#cbd5e1;
  --r:10px;--blue:#38bdf8;--yellow:#facc15;--purple:#a855f7;--purpleL:#c084fc;
  --cyan:#22d3ee;--orange:#fb923c;--red:#f87171;
  --tank:#0ea5e9;--water:#22d3ee;
  --panel:rgba(10,14,25,.82);
}
html,body{width:100%;height:100%;overflow:hidden;background:#060910}
body{font-family:'Outfit',sans-serif;color:#e0e6f0}
canvas{display:block;touch-action:none}
#C{width:100vw;height:100vh;position:relative}

/* ── TOP BAR ── */
.top{position:absolute;top:0;left:0;right:0;padding:12px 16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:20;background:linear-gradient(to bottom,rgba(6,9,16,.8) 0%,transparent 100%)}
.logo{display:flex;align-items:center;gap:10px;pointer-events:auto}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,#7c3aed,#a855f7,#c084fc);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 0 18px rgba(168,85,247,.45),inset 0 1px 0 rgba(255,255,255,.15);animation:logoPulse 3s ease-in-out infinite}
@keyframes logoPulse{0%,100%{box-shadow:0 0 18px rgba(168,85,247,.45),inset 0 1px 0 rgba(255,255,255,.15)}50%{box-shadow:0 0 28px rgba(168,85,247,.7),inset 0 1px 0 rgba(255,255,255,.2)}}
.logo-text h1{font-size:16px;font-weight:700;letter-spacing:2.5px;background:linear-gradient(90deg,#c084fc,#a855f7,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
.logo-text small{font-size:8px;font-weight:400;letter-spacing:3px;color:var(--txtd);text-transform:uppercase;display:block;margin-top:1px}
.stats{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end;max-width:60vw}
.sc{background:var(--bg);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;min-width:68px;text-align:center;transition:.25s;cursor:default;position:relative;overflow:hidden}
.sc::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(34,197,94,.04) 0%,transparent 60%);pointer-events:none}
.sc:hover{border-color:var(--bda);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.3)}
.sc .l{font-size:7px;text-transform:uppercase;letter-spacing:1.3px;color:var(--txtd);margin-bottom:3px;font-weight:500}
.sc .v{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;color:var(--gl);transition:.4s}
.sc.warn .v{color:var(--yellow)}
.sc.alert .v{color:var(--red);animation:blink .8s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
/* mini spark line inside stat card */
.sc .spark{position:absolute;bottom:2px;left:2px;right:2px;height:8px;opacity:.4}

/* ── LEFT PANEL ── */
.left{position:absolute;top:50%;left:12px;transform:translateY(-50%);pointer-events:auto;z-index:20;display:flex;flex-direction:column;gap:4px}
.lb{background:var(--panel);backdrop-filter:blur(12px);border:1px solid rgba(34,197,94,.15);border-radius:7px;padding:7px 11px;color:var(--txt);font-size:10px;font-weight:500;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:6px;white-space:nowrap;font-family:'Outfit',sans-serif}
.lb:hover,.lb.on{border-color:var(--g);color:var(--gl);background:rgba(34,197,94,.1)}
.lb.on{box-shadow:0 0 12px rgba(34,197,94,.15)}
.lb .dot{width:6px;height:6px;border-radius:50%;background:var(--txtd);transition:.2s;flex-shrink:0}
.lb.on .dot{background:var(--gl);box-shadow:0 0 8px rgba(74,222,128,.8)}

/* ── RIGHT PANEL ── */
.right{position:absolute;top:50%;right:12px;transform:translateY(-50%);pointer-events:auto;z-index:20;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:13px;padding:14px;width:180px;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.right h3{font-size:9px;font-weight:600;color:var(--gl);margin-bottom:8px;letter-spacing:1.5px;text-transform:uppercase;display:flex;align-items:center;gap:5px}
.right h3 .dot2{width:5px;height:5px;background:var(--gl);border-radius:50%;box-shadow:0 0 6px var(--gl);animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:.6}}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.sg div{font-family:'JetBrains Mono',monospace;font-size:8px;padding:5px 2px;text-align:center;border-radius:5px;border:1px solid rgba(100,116,139,.15);color:var(--txtd);transition:.3s;cursor:pointer;font-weight:500}
.sg div:hover{border-color:var(--bda);color:var(--gl)}
.sg div.cur{background:rgba(34,197,94,.2);border-color:var(--g);color:var(--gl);box-shadow:0 0 8px rgba(34,197,94,.2)}
.sg div.done{background:rgba(56,189,248,.08);border-color:rgba(56,189,248,.3);color:var(--blue)}
.sg div.scan{animation:scanPulse .65s ease-in-out infinite;background:rgba(250,204,21,.15);border-color:var(--yellow);color:var(--yellow)}
@keyframes scanPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.96)}}
.legend{margin-top:7px;font-size:8px;color:var(--txtd);display:flex;gap:8px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:3px}
.legend i{width:6px;height:6px;border-radius:50%;display:inline-block;flex-shrink:0}
.prog-wrap{margin-top:8px}
.prog-label{display:flex;justify-content:space-between;font-size:8px;color:var(--txtd);margin-bottom:4px}
.pbar{width:100%;height:4px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
.pbar-inner{height:100%;background:linear-gradient(90deg,var(--gd),var(--gl));border-radius:3px;transition:width .5s cubic-bezier(.4,0,.2,1);width:0%;box-shadow:0 0 8px rgba(74,222,128,.5)}

/* Tank telemetry panel (right panel extension) */
.tank-panel{margin-top:10px;border-top:1px solid rgba(34,197,94,.12);padding-top:10px}
.tank-panel h4{font-size:8px;font-weight:600;color:var(--cyan);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:4px}
.tank-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.tank-row .tl{font-size:8px;color:var(--txtd);text-transform:uppercase;letter-spacing:.8px}
.tank-row .tv{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;color:var(--cyan)}
.tank-level-bar{width:100%;height:6px;background:rgba(34,211,238,.08);border-radius:3px;overflow:hidden;margin-top:3px;border:1px solid rgba(34,211,238,.15)}
.tank-level-fill{height:100%;background:linear-gradient(90deg,#0369a1,#22d3ee);border-radius:3px;transition:width .8s ease;box-shadow:0 0 8px rgba(34,211,238,.4)}

/* ── BOTTOM BAR ── */
.bot{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);pointer-events:auto;z-index:20;display:flex;align-items:center;gap:14px;background:var(--panel);backdrop-filter:blur(16px);border:1px solid var(--bd);border-radius:16px;padding:10px 16px;box-shadow:0 8px 40px rgba(0,0,0,.45)}
.dpad{display:grid;grid-template-columns:34px 34px 34px;grid-template-rows:34px 34px 34px;gap:2px}
.db{background:rgba(168,85,247,.07);border:1px solid rgba(168,85,247,.2);border-radius:7px;color:#c084fc;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.12s;user-select:none;-webkit-user-select:none;font-family:'Outfit',sans-serif}
.db:hover{background:rgba(168,85,247,.2);border-color:var(--purple);box-shadow:0 0 12px rgba(168,85,247,.3)}
.db:active{background:rgba(168,85,247,.35);transform:scale(.88);box-shadow:0 0 20px rgba(168,85,247,.5)}
.db.active{background:rgba(168,85,247,.3);border-color:var(--purple);box-shadow:0 0 14px rgba(168,85,247,.4)}
.db.ctr{background:rgba(168,85,247,.03);border-color:rgba(168,85,247,.06);cursor:default;font-size:8px;color:var(--txtd);letter-spacing:.5px}
.db.emp{background:0;border:0}
.cam-info{display:flex;flex-direction:column;gap:4px;min-width:130px}
.ci-row{display:flex;align-items:center;gap:8px}
.ci-lbl{font-size:8px;text-transform:uppercase;letter-spacing:1px;color:var(--txtd);width:46px;font-weight:500}
.ci-val{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--txtl);font-weight:500}
.spd-row{display:flex;align-items:center;gap:6px;margin-top:2px}
.spd-row label{font-size:8px;color:var(--txtd);text-transform:uppercase;letter-spacing:.8px}
.spd-row input[type=range]{-webkit-appearance:none;width:72px;height:3px;border-radius:2px;background:rgba(168,85,247,.15);outline:0;cursor:pointer}
.spd-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--purple);cursor:pointer;box-shadow:0 0 8px rgba(168,85,247,.6);transition:.1s}
.spd-row input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.2)}
.mode-btns{display:flex;flex-direction:column;gap:4px}
.mbtn{background:rgba(10,14,25,.9);border:1px solid var(--bd);border-radius:8px;padding:7px 11px;color:var(--txt);font-family:'Outfit',sans-serif;font-size:10px;font-weight:600;cursor:pointer;transition:.25s;white-space:nowrap;text-align:center}
.mbtn:hover{border-color:var(--purple);color:var(--purpleL);background:rgba(168,85,247,.07)}
.mbtn.on{background:rgba(168,85,247,.16);border-color:var(--purple);color:var(--purpleL);box-shadow:0 0 14px rgba(168,85,247,.2)}

/* ── OVERLAY ELEMENTS ── */
.flash{position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.4) 0%,rgba(255,255,255,.1) 60%,transparent 100%);opacity:0;pointer-events:none;z-index:30;transition:opacity 60ms}
.flash.on{opacity:1}
.toast{position:absolute;top:72px;left:50%;transform:translateX(-50%) translateY(-8px);pointer-events:none;z-index:25;background:var(--panel);backdrop-filter:blur(12px);border:1px solid rgba(168,85,247,.35);border-radius:9px;padding:8px 16px;font-size:11px;color:var(--purpleL);opacity:0;transition:.35s cubic-bezier(.4,0,.2,1);font-family:'JetBrains Mono',monospace;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.tooltip{position:absolute;pointer-events:none;z-index:40;background:var(--panel);backdrop-filter:blur(10px);border:1px solid rgba(34,197,94,.3);border-radius:8px;padding:6px 10px;font-size:10px;color:var(--gl);font-family:'JetBrains Mono',monospace;opacity:0;transition:.2s;transform:translateY(4px);white-space:nowrap}
.tooltip.on{opacity:1;transform:translateY(0)}

/* ── MINI COMPASS ── */
.compass{position:absolute;bottom:14px;right:14px;z-index:20;width:52px;height:52px;pointer-events:none}
.compass svg{width:100%;height:100%;filter:drop-shadow(0 0 6px rgba(168,85,247,.4))}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  .stats{display:none}
  .right{display:none}
  .bot{padding:8px;gap:8px;flex-wrap:wrap;justify-content:center;max-width:96vw;bottom:8px}
  .left{gap:3px;left:6px;transform:translateY(-50%) scale(.9);transform-origin:left center}
  .dpad{grid-template-columns:32px 32px 32px;grid-template-rows:32px 32px 32px}
  .cam-info{min-width:100px}
  .compass{bottom:auto;top:74px;right:8px;width:40px;height:40px}
  .toast{font-size:10px;max-width:80vw}
}
@media(max-width:480px){
  .mode-btns{flex-direction:row;gap:3px}.mbtn{padding:6px 7px;font-size:9px}
  .logo-text h1{font-size:13px;letter-spacing:1.5px}
  .left{display:none}
}
@media(min-width:1400px){
  .sc{min-width:78px}.sc .v{font-size:14px}
}
</style>
</head>
<body>
<div id="C">
  <div class="flash" id="fl"></div>
  <div class="toast" id="ts"></div>
  <div class="tooltip" id="tip"></div>

  <!-- TOP -->
  <div class="top">
    <div class="logo">
      <div class="logo-icon">🌿</div>
      <div class="logo-text"><h1>INOVATECH</h1><small>Hidroponia Indoor IoT</small></div>
    </div>
    <div class="stats">
      <div class="sc" id="sc-T"><div class="l">Temp</div><div class="v" id="vT">24.0°C</div></div>
      <div class="sc" id="sc-H"><div class="l">Umidade</div><div class="v" id="vH">68%</div></div>
      <div class="sc" id="sc-PH"><div class="l">pH</div><div class="v" id="vPH" style="color:var(--blue)">6.2</div></div>
      <div class="sc" id="sc-EC"><div class="l">EC mS</div><div class="v" id="vEC" style="color:var(--blue)">1.8</div></div>
      <div class="sc" id="sc-TK"><div class="l">Tanque</div><div class="v" id="vTK" style="color:var(--cyan)">78%</div></div>
      <div class="sc"><div class="l">Setor</div><div class="v" id="vS">A1</div></div>
      <div class="sc"><div class="l">IA</div><div class="v" id="vC">0.92</div></div>
      <div class="sc"><div class="l">Modo</div><div class="v" id="vM" style="font-size:10px">MANUAL</div></div>
    </div>
  </div>

  <!-- LEFT LAYER BUTTONS -->
  <div class="left" id="layerBtns"></div>

  <!-- RIGHT PANEL -->
  <div class="right">
    <h3><span class="dot2"></span> Mapa de Setores</h3>
    <div class="sg" id="sgUI"></div>
    <div class="legend">
      <span><i style="background:var(--gl)"></i>Atual</span>
      <span><i style="background:var(--blue)"></i>Escaneado</span>
      <span><i style="background:var(--yellow)"></i>Escaneando</span>
    </div>
    <div class="prog-wrap">
      <div class="prog-label"><span>Progresso</span><span id="progPct">0%</span></div>
      <div class="pbar"><div class="pbar-inner" id="pbar"></div></div>
    </div>
    <!-- Tank telemetry -->
    <div class="tank-panel">
      <h4>💧 Tanque</h4>
      <div class="tank-row"><span class="tl">Nível</span><span class="tv" id="tTL">78%</span></div>
      <div class="tank-level-bar"><div class="tank-level-fill" id="tankFill" style="width:78%"></div></div>
      <div class="tank-row" style="margin-top:5px"><span class="tl">Temp</span><span class="tv" id="tTT">22.1°C</span></div>
      <div class="tank-row"><span class="tl">pH</span><span class="tv" id="tTPH">6.3</span></div>
      <div class="tank-row"><span class="tl">Bomba</span><span class="tv" id="tPump" style="color:var(--gl)">ATIVA</span></div>
    </div>
  </div>

  <!-- BOTTOM BAR -->
  <div class="bot">
    <div class="dpad">
      <div class="db emp"></div>
      <div class="db" data-d="fwd" title="Frente (W)">▲</div>
      <div class="db emp"></div>
      <div class="db" data-d="left" title="Esquerda (A)">◀</div>
      <div class="db ctr">CAM</div>
      <div class="db" data-d="right" title="Direita (D)">▶</div>
      <div class="db emp"></div>
      <div class="db" data-d="back" title="Ré (S)">▼</div>
      <div class="db emp"></div>
    </div>
    <div class="cam-info">
      <div class="ci-row"><span class="ci-lbl">Pos X</span><span class="ci-val" id="cpX">0.0</span></div>
      <div class="ci-row"><span class="ci-lbl">Pos Z</span><span class="ci-val" id="cpZ">0.0</span></div>
      <div class="ci-row"><span class="ci-lbl">Setor</span><span class="ci-val" id="cpS">A1</span></div>
      <div class="spd-row"><label>Vel</label><input type="range" id="spdR" min="1" max="10" value="5"></div>
    </div>
    <div class="mode-btns">
      <button class="mbtn" id="bM" onclick="setMode('manual')">🎮 Manual</button>
      <button class="mbtn" id="bA" onclick="setMode('auto')">🤖 Automático</button>
      <button class="mbtn" onclick="capture()">📸 Capturar</button>
    </div>
  </div>

  <!-- COMPASS -->
  <div class="compass" id="compassWrap">
    <svg viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="26" cy="26" r="24" stroke="rgba(168,85,247,.3)" stroke-width="1.5"/>
      <circle cx="26" cy="26" r="18" stroke="rgba(168,85,247,.15)" stroke-width="1"/>
      <text x="26" y="9" text-anchor="middle" fill="#c084fc" font-size="7" font-family="JetBrains Mono,monospace" font-weight="600">N</text>
      <text x="45" y="29" text-anchor="middle" fill="rgba(148,163,184,.5)" font-size="6" font-family="JetBrains Mono,monospace">L</text>
      <text x="26" y="47" text-anchor="middle" fill="rgba(148,163,184,.5)" font-size="6" font-family="JetBrains Mono,monospace">S</text>
      <text x="7" y="29" text-anchor="middle" fill="rgba(148,163,184,.5)" font-size="6" font-family="JetBrains Mono,monospace">O</text>
      <g id="compassNeedle">
        <polygon points="26,10 24,26 26,28 28,26" fill="#c084fc" opacity=".9"/>
        <polygon points="26,42 24,26 26,28 28,26" fill="rgba(148,163,184,.4)"/>
      </g>
    </svg>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var dom={
  fl:$('fl'),ts:$('ts'),tip:$('tip'),
  vT:$('vT'),vH:$('vH'),vPH:$('vPH'),vEC:$('vEC'),vTK:$('vTK'),
  vS:$('vS'),vC:$('vC'),vM:$('vM'),
  cpX:$('cpX'),cpZ:$('cpZ'),cpS:$('cpS'),
  spdR:$('spdR'),pbar:$('pbar'),progPct:$('progPct'),
  bM:$('bM'),bA:$('bA'),sgUI:$('sgUI'),layerBtns:$('layerBtns'),
  tTL:$('tTL'),tTT:$('tTT'),tTPH:$('tTPH'),tPump:$('tPump'),tankFill:$('tankFill'),
  compassNeedle:$('compassNeedle')
};

/* ── CONSTANTS ── */
var COLS=4,ROWS=3,CL=['A','B','C','D'];
var GW=6,GL=12,GH=6;
var hL=GL/2,hW=GW/2;
var baseY=0.15,channelH=0.4,channelY=baseY+0.1;
var plantBaseY=channelY+channelH;
var railY=GH-0.6;
var pMinX=-hL+0.5,pMaxX=hL-0.5,pMinZ=-hW+0.5,pMaxZ=hW-0.5;
var pW=pMaxX-pMinX,pD=pMaxZ-pMinZ;
var PI=Math.PI,PI2=PI*2,HP=PI/2;
var NUM_CHANNELS=6;
var chSpacing=pD/(NUM_CHANNELS-1);

/* ── TANK BELOW GREENHOUSE ── */
var TANK_H=1.4;   // tank height below ground
var TANK_Y=-0.5-TANK_H/2; // centered below base

/* ── RENDERER ── */
var scene=new THREE.Scene();
scene.background=new THREE.Color(0x060910);
scene.fog=new THREE.FogExp2(0x060910,0.005);

var cam3d=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,0.1,500);
var renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance',alpha:false});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;
$('C').appendChild(renderer.domElement);

/* ── LIGHTS ── */
scene.add(new THREE.AmbientLight(0x233355,0.4));
var sun=new THREE.DirectionalLight(0xffffff,0.5);
sun.position.set(10,18,8);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.far=50;sun.shadow.camera.left=-14;sun.shadow.camera.right=14;
sun.shadow.camera.top=14;sun.shadow.camera.bottom=-14;
sun.shadow.bias=-0.001;
scene.add(sun);

var purpleAmb=new THREE.PointLight(0x9933ff,0.7,22);purpleAmb.position.set(0,GH-1,0);scene.add(purpleAmb);
var pinkAmb=new THREE.PointLight(0xff33aa,0.35,18);pinkAmb.position.set(3,GH-1,1);scene.add(pinkAmb);
var tankLight=new THREE.PointLight(0x22d3ee,0.5,8);tankLight.position.set(0,TANK_Y+0.5,0);scene.add(tankLight);
var fillLight=new THREE.DirectionalLight(0x334466,0.25);fillLight.position.set(-6,4,-6);scene.add(fillLight);

/* ── FLOOR ── */
var ground=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshStandardMaterial({color:0x07090f,roughness:0.95,metalness:0.05}));
ground.rotation.x=-HP;ground.position.y=-0.51;ground.receiveShadow=true;scene.add(ground);

function pm(geo,mat,x,y,z){
  var m=new THREE.Mesh(geo,mat);
  m.position.set(x||0,y||0,z||0);
  return m;
}
function mkTube(pts,r,mat,segs){
  return new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),segs||14,r,7,false),mat);
}
function mkF(x1,y1,z1,x2,y2,z2,radius){
  var r=radius||0.07;
  var dx=x2-x1,dy=y2-y1,dz=z2-z1,len=Math.sqrt(dx*dx+dy*dy+dz*dz);
  var m=pm(new THREE.CylinderGeometry(r,r,len,7),M.frame,(x1+x2)/2,(y1+y2)/2,(z1+z2)/2);
  if(Math.abs(dy)<0.001){if(Math.abs(dz)>0.001)m.rotation.x=HP;else m.rotation.z=HP;}
  else if(Math.abs(dx)>0.001||Math.abs(dz)>0.001){
    var q=new THREE.Quaternion();q.setFromUnitVectors(new THREE.Vector3(0,1,0),new THREE.Vector3(dx,dy,dz).normalize());
    m.setRotationFromQuaternion(q);
  }
  m.castShadow=true;return m;
}

/* ═══════════════════════════════════════════════
   ANIMATION LOOP
═══════════════════════════════════════════════ */
var time=0,lastT=performance.now()*0.001,uiTick=0;
var plantKids=GR.plants.children;
// Ripple geometry access
var ripplePos=rippleGeo.attributes.position;
var rippleCount=ripplePos.count;

function updCamMove(dt){
  var s=spd*dt;
  if(mode==='manual'){
    if(mv.fwd)tgtZ-=s;if(mv.back)tgtZ+=s;if(mv.left)tgtX-=s;if(mv.right)tgtX+=s;
    tgtX=clamp(tgtX,pMinX,pMaxX);tgtZ=clamp(tgtZ,pMinZ,pMaxZ);
  }else{
    var tgt=secCenters[scanOrder[aIdx]];
    if(aPhase==='move'){tgtX=tgt.x;tgtZ=tgt.z;if(Math.sqrt(Math.pow(tgtX-camX,2)+Math.pow(tgtZ-camZ,2))<0.12){aPhase='scan';window.capture()}}
    else if(aPhase==='scan'){if(!capturing){aPhase='wait';aWait=0}}
    else{aWait+=dt;if(aWait>0.45){aIdx++;if(aIdx>=scanOrder.length){aIdx=0;for(var i=0;i<secStates.length;i++)secStates[i]='idle';}aPhase='move'}}
  }
  var lr=Math.min(1,7*dt);
  camX+=(tgtX-camX)*lr;camZ+=(tgtZ-camZ)*lr;
  camX=clamp(camX,pMinX,pMaxX);camZ=clamp(camZ,pMinZ,pMaxZ);
  crossRail.position.x=camX;camCar.position.x=camX;camCar.position.z=camZ;
  beam.position.x=camX;beam.position.z=camZ;
  curSec=getSec(camX,camZ);var sc=secCenters[curSec];
  hl.position.x=sc.x;hl.position.z=sc.z;
  beamMat.opacity=capturing?(0.07+Math.sin(time*16)*0.04):0;
}

function loop(){
  requestAnimationFrame(loop);
  var now=performance.now()*0.001,dt=Math.min(now-lastT,0.05);
  lastT=now;time+=dt;

  /* ── Grow lights pulse ── */
  var lIntensity=0.18+Math.sin(time*1.4)*0.08;
  for(var gl=0;gl<growLights.length;gl++) growLights[gl].intensity=lIntensity+Math.sin(time*2.2+gl*0.5)*0.04;
  purpleAmb.intensity=0.55+Math.sin(time*1.6)*0.12;
  pinkAmb.intensity=0.28+Math.sin(time*1.9+1)*0.09;

  /* ── Camera LED flash ── */
  recLed.material.emissiveIntensity=1.8+Math.sin(time*7)*0.8;

  /* ── Sector highlight ── */
  hlMat.opacity=0.05+Math.sin(time*3)*0.025;

  /* ── Nutrient shimmer ── */
  wb.material.opacity=0.42+Math.sin(time*1.1)*0.08;
  M.nutrient.opacity=0.45+Math.sin(time*1.8)*0.05;

  /* ── Plant sway (improved: each plant has unique phase) ── */
  for(var pi=0,pn=plantKids.length;pi<pn;pi++){
    var pk=plantKids[pi];
    var phase=pi*0.62;
    pk.rotation.z=Math.sin(time*0.38+phase)*0.018+Math.sin(time*0.91+phase*1.3)*0.007;
    pk.rotation.x=Math.sin(time*0.29+phase*1.1)*0.012+Math.sin(time*0.67+phase)*0.005;
  }

  /* ── Water ripple animation ── */
  for(var ri=0;ri<rippleCount;ri++){
    var rx=ripplePos.getX(ri);var rz2=ripplePos.getZ(ri);
    var dist=Math.sqrt(rx*rx+rz2*rz2);
    ripplePos.setY(ri,Math.sin(dist*3.5-time*2.4)*0.028+Math.sin(dist*5.2-time*1.7+0.5)*0.012);
  }
  ripplePos.needsUpdate=true;
  rippleGeo.computeVertexNormals();
  rippleMat.opacity=0.5+Math.sin(time*1.5)*0.08;

  /* ── Tank water level gentle bob ── */
  var wBob=Math.sin(time*0.8)*0.012;
  rippleMesh.position.y=TY-TH/2+waterH+0.01+wBob;
  tankWaterMesh.scale.y=1+wBob*0.02;

  /* ── Tank light pulse ── */
  tankLight.intensity=0.45+Math.sin(time*2.2)*0.15;

  /* ── Bubble animation ── */
  for(var bj=0;bj<bubbles.length;bj++){
    var bub2=bubbles[bj];var ud=bub2.userData;
    bub2.position.y+=ud.spd*dt;
    bub2.position.x=ud.ox+Math.sin(time*1.2+ud.phase)*0.04;
    bub2.position.z=ud.oz+Math.cos(time*0.9+ud.phase+1)*0.04;
    if(bub2.position.y>ud.endY){bub2.position.y=ud.startY+Math.random()*0.1;bub2.position.x=(Math.random()-0.5)*(TW-0.5);bub2.position.z=(Math.random()-0.5)*(TD-0.5);ud.ox=bub2.position.x;ud.oz=bub2.position.z;ud.spd=0.15+Math.random()*0.45;}
    var alpha=((bub2.position.y-ud.startY)/(ud.endY-ud.startY));
    bub2.material.opacity=0.05+alpha*0.3;
    bub2.scale.setScalar(0.7+alpha*0.6);
  }

  updCamMove(dt);

  uiTick++;
  if(uiTick%5===0){
    var sc2=secCenters[curSec];
    dom.cpX.textContent=camX.toFixed(1);dom.cpZ.textContent=camZ.toFixed(1);
    dom.cpS.textContent=sc2.label;dom.vS.textContent=sc2.label;
    updSecUI();
  }
  if(uiTick%30===0){
    var T=(23+Math.sin(time*0.3)*2.2).toFixed(1);
    var H=Math.round(65+Math.sin(time*0.22+1)*7);
    var pH=(6.0+Math.sin(time*0.11)*0.35).toFixed(1);
    var EC=(1.6+Math.sin(time*0.09)*0.32).toFixed(1);
    var conf=(0.87+Math.sin(time*0.14)*0.08).toFixed(2);
    var tankLvl=Math.round(72+Math.sin(time*0.05)*8);
    var tankT=(21.5+Math.sin(time*0.12)*1.5).toFixed(1);
    var tankPH=(6.2+Math.sin(time*0.08)*0.2).toFixed(1);
    dom.vT.textContent=T+'°C';
    dom.vH.textContent=H+'%';
    dom.vPH.textContent=pH;
    dom.vEC.textContent=EC;
    dom.vC.textContent=conf;
    dom.vTK.textContent=tankLvl+'%';
    dom.tTL.textContent=tankLvl+'%';
    dom.tTT.textContent=tankT+'°C';
    dom.tTPH.textContent=tankPH;
    dom.tankFill.style.width=tankLvl+'%';
    // alert states
    document.getElementById('sc-T').className='sc'+(T>26?' warn':'');
    document.getElementById('sc-H').className='sc'+(H<55?' warn':'');
    document.getElementById('sc-TK').className='sc'+(tankLvl<30?' alert':'');
  }

  renderer.render(scene,cam3d);
}
loop();

window.addEventListener('resize',function(){
  cam3d.aspect=innerWidth/innerHeight;cam3d.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});
})();
</script>
